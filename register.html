<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register • Jualanku</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 400px;
      padding: 32px;
    }
    h1 {
      text-align: center;
      color: #0f766e;
      margin-bottom: 24px;
      font-weight: 700;
    }
    .input-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #0f766e;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      transition: border 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #0d9488;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
    }
    button {
      width: 100%;
      padding: 14px;
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #0f766e;
    }
    .links {
      text-align: center;
      margin-top: 20px;
    }
    .links a {
      color: #0d9488;
      text-decoration: none;
      font-weight: 500;
    }
    .links a:hover { text-decoration: underline; }
    .error {
      color: #e53e3e;
      text-align: center;
      margin-top: 12px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Daftar Akun</h1>
    <div class="input-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="misal: joko123" required />
    </div>
    <div class="input-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="contoh@email.com" required />
    </div>
    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Minimal 6 karakter" required />
    </div>
    <button onclick="register()">Daftar</button>
    <div id="error" class="error"></div>
    <div class="links">
      Sudah punya akun? <a href="login.html">Login di sini</a>
    </div>
  </div>

  <script>
    const API_BASE = 'https://jualanku-api.vercel.app/api';

    async function register() {
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error');

      if (!username || !email || !password) {
        errorDiv.textContent = 'Semua kolom wajib diisi';
        return;
      }
      if (password.length < 6) {
        errorDiv.textContent = 'Password minimal 6 karakter';
        return;
      }

      errorDiv.textContent = '';
      try {
        const res = await fetch(`${API_BASE}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });

        const data = await res.json();

        if (res.ok) {
          alert('✅ Registrasi berhasil! Silakan login.');
          window.location.href = 'login.html';
        } else {
          errorDiv.textContent = data.error || 'Registrasi gagal';
        }
      } catch (err) {
        errorDiv.textContent = 'Gagal terhubung ke server';
        console.error(err);
      }
    }

    document.getElementById('password').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') register();
    });
  </script>

</body>
</html>
