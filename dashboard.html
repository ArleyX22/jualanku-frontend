<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard • Jualanku</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
    }
    .user-info {
      font-weight: 500;
      color: #4b5563;
    }
    .btn {
      padding: 10px 16px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn:hover { background: #2563eb; }
    .btn-outline {
      background: transparent;
      border: 1px solid #cbd5e1;
      color: #4b5563;
    }
    .btn-outline:hover {
      background: #f1f5f9;
    }
    .form-group {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .form-group input {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 16px;
    }
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .item-card {
      background: white;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border-left: 4px solid #10b981;
    }
    .item-name {
      font-weight: 600;
      font-size: 18px;
      margin-bottom: 4px;
    }
    .item-qty {
      color: #64748b;
      font-size: 14px;
    }
    .item-actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }
    .item-actions button {
      flex: 1;
      padding: 6px;
      font-size: 14px;
    }
    .btn-edit { background: #f59e0b; }
    .btn-edit:hover { background: #d97706; }
    .btn-delete { background: #ef4444; }
    .btn-delete:hover { background: #dc2626; }

    #error-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    #error-message {
      background: white;
      padding: 24px;
      border-radius: 12px;
      max-width: 600px;
      text-align: left;
    }
    #error-message h3 {
      color: #e53e3e;
      margin-bottom: 12px;
    }
    #error-message pre {
      background: #f8fafc;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 14px;
    }
    @media (max-width: 600px) {
      .form-group { flex-direction: column; }
      header { flex-direction: column; gap: 12px; text-align: center; }
    }
  </style>
</head>
<body>

  <div id="error-overlay" style="display:none">
    <div id="error-message">
      <h3>❌ Terjadi Kesalahan</h3>
      <p id="error-text"></p>
      <button class="btn" onclick="document.getElementById('error-overlay').style.display='none'">Tutup</button>
      <button class="btn btn-outline" onclick="window.location.href='login.html'">Kembali ke Login</button>
    </div>
  </div>

  <div class="container">
    <header>
      <div>
        <h1>📦 Daftar Penjualan</h1>
        <div class="user-info">Halo, <span id="username">User</span>!</div>
      </div>
      <button class="btn btn-outline" onclick="logout()">🚪 Logout</button>
    </header>

    <div class="form-group">
      <input type="text" id="item-name" placeholder="Nama barang (misal: Buku Tulis)" />
      <input type="number" id="item-qty" placeholder="Jumlah" min="1" />
      <button class="btn" onclick="addItem()">➕ Tambah</button>
    </div>

    <div id="items-container" class="items-grid">
      <p style="text-align:center;color:#64748b">Memuat data...</p>
    </div>
  </div>

  <script>
    // ✅ FIX: HAPUS SPASI DI AKHIR URL!
    const API_BASE = 'https://jualanku-api.vercel.app/api';
    let token = localStorage.getItem('token');
    let user = JSON.parse(localStorage.getItem('user'));

    function showError(message) {
      document.getElementById('error-text').innerText = message;
      document.getElementById('error-overlay').style.display = 'flex';
    }

    if (!token || !user || !user.id) {
      showError('❌ Anda belum login.\nKembali ke halaman login.');
      setTimeout(() => window.location.href = 'login.html', 3000);
    } else {
      document.getElementById('username').textContent = user.username || 'User';
      setTimeout(loadItems, 500);
    }

    async function loadItems() {
      const container = document.getElementById('items-container');
      container.innerHTML = '<p style="text-align:center;color:#64748b">Memuat data...</p>';

      try {
        const res = await fetch(`${API_BASE}/items`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);

        const data = await res.json();
        if (data.items?.length > 0) {
          container.innerHTML = data.items.map(item => `
            <div class="item-card">
              <div class="item-name">${escapeHtml(item.name)}</div>
              <div class="item-qty">Qty: ${item.qty}</div>
              <div class="item-actions">
                <button class="btn btn-edit" onclick="editItem(${item.id}, ${JSON.stringify(item.name)}, ${item.qty})">✏️ Edit</button>
                <button class="btn btn-delete" onclick="deleteItem(${item.id})">🗑️ Hapus</button>
              </div>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<p style="text-align:center;color:#64748b">Belum ada data penjualan.</p>';
        }
      } catch (err) {
        showError(`Gagal memuat data:\n${err.message}`);
      }
    }

    async function addItem() {
      const name = document.getElementById('item-name').value.trim();
      const qty = parseInt(document.getElementById('item-qty').value);
      if (!name || isNaN(qty) || qty < 1) {
        showError('⚠️ Nama dan jumlah wajib diisi.');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/items`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ name, qty })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);

        document.getElementById('item-name').value = '';
        document.getElementById('item-qty').value = '';
        loadItems();
      } catch (err) {
        showError(`❌ Gagal menambah item:\n${err.message}`);
      }
    }

    // ✅ FIX: Edit Item — pastikan id dikirim sebagai query param
    async function editItem(id, name, qty) {
      const newName = prompt('Ubah nama:', name);
      if (newName === null) return;
      const newQty = parseInt(prompt('Ubah jumlah:', qty));
      if (isNaN(newQty) || newQty < 1) {
        alert('Jumlah harus angka ≥ 1');
        return;
      }

      try {
        // ✅ URL benar: /items?id=123 (tanpa encode berlebihan)
        const url = `${API_BASE}/items?id=${id}`;
        const res = await fetch(url, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ name: newName.trim(), qty: newQty })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);

        loadItems(); // Refresh data
      } catch (err) {
        showError(`❌ Gagal edit item:\n${err.message}`);
      }
    }

    // ✅ FIX: Delete Item — pastikan id di URL
    async function deleteItem(id) {
      if (!confirm('Yakin hapus item ini?')) return;

      try {
        const url = `${API_BASE}/items?id=${id}`;
        const res = await fetch(url, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);

        loadItems();
      } catch (err) {
        showError(`❌ Gagal hapus item:\n${err.message}`);
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>

</body>
</html>
